name: CI
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/master' }}"
"on":
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CC: sccache clang
  CXX: sccache clang++
  # Go toolchain for CI. "stable" is a setup-go alias that always resolves
  # to the latest Go release, independent of the runner image's preinstalled
  # version; only the minimum supported toolchain is pinned to a literal.
  GO_VERSION: "stable"
  # Oldest supported Go toolchain (the go.mod minimum); the go job runs it
  # to exercise the --go118 compatibility code path. Bump only when the
  # minimum-version policy changes.
  # The go job's matrix repeats these two values as literals because
  # matrix definitions cannot reference env contexts -- keep them in sync.
  GO_MIN_VERSION: "1.18"
jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
    steps:
      - uses: actions/checkout@v7
      # Anchored so the lint job reuses the exact same step (*setup-sccache).
      # GitHub Actions supports YAML anchors since 2025-09, but not merge
      # keys -- alias whole step maps only.
      - &setup-sccache
        name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # rust2go-mem-ffi and mem-ring reject enabling `monoio` and `tokio`
      # together (compile_error!), so --all-features is not usable here.
      # Build with default features (monoio) and cover the tokio branch and
      # the non-default rust2go/build feature with the steps below.
      # example-tokio-mem is excluded because feature unification with
      # example-monoio-mem would enable both runtimes on rust2go-mem-ffi.
      - name: Build
        run: cargo check --workspace --exclude example-tokio-mem --all-targets
      - name: Build example-tokio-mem
        run: cargo check -p example-tokio-mem --all-targets
      - name: Build rust2go-mem-ffi (tokio)
        run: cargo check -p rust2go-mem-ffi --no-default-features --features tokio --all-targets
      - name: Build rust2go (build feature)
        run: cargo check -p rust2go --features build --all-targets
      - name: Test
        run: cargo test --workspace --exclude mem-ring --exclude example-tokio-mem --all-targets
      - name: Test rust2go-mem-ffi (tokio)
        run: cargo test -p rust2go-mem-ffi --no-default-features --features tokio --all-targets
      # Test mem-ring separately with the feature set declared by its own
      # Cargo.toml. In a workspace-wide build, feature unification pulls
      # monoio's "sync" feature (required by the `test` crate) into
      # mem-ring's test binary, and monoio 0.2.4's sync machinery combined
      # with mem-ring's spawn-and-leak-at-runtime-drop pattern corrupts the
      # heap on test teardown (glibc "unaligned tcache chunk detected").
      # mem-ring itself does not use monoio/sync.
      # Default features only exercise the monoio branch of mem-ring (monoio
      # and tokio are mutually exclusive), so the tokio feature set runs in
      # the same step.
      - name: Test mem-ring
        run: |
          cargo test -p mem-ring --all-targets
          cargo test -p mem-ring --no-default-features --features tokio --all-targets
      # Building the workspace above regenerates the committed Go bindings
      # (test/go/gen.go, examples/example-bidirectional/go/gen.go) via
      # build.rs scripts; fail if the committed copies have drifted from
      # what the .rs sources generate. The four r2g examples' gen.go files
      # are gitignored build artifacts regenerated from examples/shared on
      # every build.
      - name: Check generated Go files are up to date
        run: git diff --exit-code -- '**/gen.go'
      # The four r2g examples keep a byte-identical copy of the shared Go demo
      # implementation (examples/shared/impl.go.tmpl) at go/impl.go; fail if
      # any copy has drifted from the template.
      - name: Check example impl.go copies are in sync
        run: |
          for ex in example-tokio example-monoio example-tokio-mem example-monoio-mem; do
            diff -u examples/shared/impl.go.tmpl "examples/$ex/go/impl.go"
          done

  go:
    name: go ${{ matrix.go-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GODEBUG: invalidptr=0,cgocheck=0
    strategy:
      fail-fast: false
      matrix:
        include:
          # The go-version literals mirror env.GO_VERSION / env.GO_MIN_VERSION
          # (see the comment there). `gates: true` marks the legs that also
          # run the gofmt/vet gates.
          - os: ubuntu-latest
            go-version: "stable"
            gates: true
          - os: ubuntu-latest
            go-version: "1.18"
          # macos-latest is arm64: exercises the arm64 assembly path of
          # asmcall, which the ubuntu legs never compile.
          - os: macos-latest
            go-version: "stable"
            gates: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: gofmt check
        if: matrix.gates && matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        if: matrix.gates
        run: |
          go vet ./...
          (cd test/go && go vet ./...)
      # asmcall correctness tests live in the standalone asmcall/calltest
      # package (cgo is not allowed in test-only packages). test/go exercises
      # the committed go118-flavored generated bindings (including the
      # mem-ring package it imports), which is what makes the 1.18 leg a
      # real compatibility check.
      - name: go test
        run: |
          go test ./asmcall/... ./mem-ring/...
          (cd test/go && go test ./...)

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # sccache does not work well with coverage instrumentation;
      # override the workflow-level cache settings for this job.
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --exclude mem-ring --exclude example-tokio-mem --all-targets --lcov --output-path lcov.info
      # See the build-and-test job for why mem-ring is tested separately.
      # Default features (monoio) are used: monoio and tokio are mutually
      # exclusive, so --all-features is not usable.
      - name: Collect mem-ring coverage
        run: cargo llvm-cov -p mem-ring --all-targets --lcov --output-path lcov-mem-ring.info
      - name: Collect Go coverage
        working-directory: test/go
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info,lcov-mem-ring.info,test/go/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *setup-sccache
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      # See the build-and-test job for why --all-features is not usable and
      # example-tokio-mem is linted separately.
      - run: cargo clippy --workspace --exclude example-tokio-mem --all-targets -- --deny warnings
      - run: cargo clippy -p example-tokio-mem --all-targets -- --deny warnings
      - run: cargo clippy -p rust2go-mem-ffi --no-default-features --features tokio --all-targets -- --deny warnings
      - run: cargo clippy -p rust2go --features build --all-targets -- --deny warnings
