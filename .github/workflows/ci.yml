name: CI
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/master' }}"
"on":
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CC: sccache clang
  CXX: sccache clang++
jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo check --all-features --all-targets
      - name: Diagnose mem-ring crash
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          cargo test -p mem-ring --all-features --lib --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -name 'mem_ring-*' -type f -executable | head -1)
          echo "test binary: $BIN"
          MALLOC_CHECK_=3 GLIBC_TUNABLES=glibc.malloc.tcache_count=0 gdb -batch -ex run -ex bt -ex 'info threads' --args $BIN --test-threads=1 2>&1 | tail -120 || true
      - name: Test
        run: cargo test --all-features --all-targets -- --test-threads=1 --skip mem_ring

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # sccache does not work well with coverage instrumentation;
      # override the workflow-level cache settings for this job.
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info -- --test-threads=1
      - name: Collect Go coverage
        working-directory: test/go
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info,test/go/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- --deny warnings
