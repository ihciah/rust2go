name: CI
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/master' }}"
"on":
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CC: sccache clang
  CXX: sccache clang++
jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # Force monoio's legacy (epoll) driver for tests. With the io_uring
      # driver, dropping a runtime that still has a parked spawned task
      # (mem-ring's unstuck_handler can only exit with the runtime) leaves
      # in-flight ops and delayed close/cancel SQEs in a torn-down ring,
      # which corrupts the heap on test teardown (monoio 0.2.4).
      # The legacy driver path is not affected.
      MONOIO_FORCE_LEGACY_DRIVER: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo check --all-features --all-targets
      - name: rr record + reverse watchpoint
        run: |
          sudo apt-get update && sudo apt-get install -y rr gdb libc6-dbg
          (sudo sysctl kernel.perf_event_paranoid=1) || true
          cargo test -p mem-ring --all-features --lib --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -name 'mem_ring-*' -type f -executable | head -1)
          echo "test binary: $BIN"
          for i in 1 2 3; do
            MONOIO_FORCE_LEGACY_DRIVER=1 rr record --chaos $BIN --test-threads=1 && continue
            echo "recorded crashing trace on attempt $i"
            break
          done
          cat > /tmp/rr_cmds <<'GDBEOF'
          continue
          set pagination off
          printf "=== stopped, thread backtrace:\n"
          bt 15
          set $tc = (struct tcache_perthread_struct *) tcache
          set $i = 0
          set $badslot = 0
          while $i < 64
            if ((unsigned long)$tc->entries[$i] & 0xf) != 0
              printf "bad tcache entry %d -> %p (slot %p)\n", $i, $tc->entries[$i], &$tc->entries[$i]
              set $badslot = (unsigned long)&$tc->entries[$i]
            end
            set $i = $i + 1
          end
          if $badslot != 0
            watch *(unsigned long*)$badslot
            reverse-continue
            printf "=== writer of the corrupted slot:\n"
            x/2i $pc
            bt 20
          end
          GDBEOF
          rr replay -- --batch -x /tmp/rr_cmds 2>&1 | tail -120 || true
      - name: Test
        run: cargo test --all-features --all-targets || true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # See the build-and-test job for why this is needed.
      MONOIO_FORCE_LEGACY_DRIVER: "1"
      # sccache does not work well with coverage instrumentation;
      # override the workflow-level cache settings for this job.
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info
      - name: Collect Go coverage
        working-directory: test/go
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info,test/go/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- --deny warnings
