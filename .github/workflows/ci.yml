name: CI
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/master' }}"
"on":
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CC: sccache clang
  CXX: sccache clang++
jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # Force monoio's legacy (epoll) driver for tests. With the io_uring
      # driver, dropping a runtime that still has a parked spawned task
      # (mem-ring's unstuck_handler can only exit with the runtime) leaves
      # in-flight ops and delayed close/cancel SQEs in a torn-down ring,
      # which corrupts the heap on test teardown (monoio 0.2.4).
      # The legacy driver path is not affected.
      MONOIO_FORCE_LEGACY_DRIVER: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo check --all-features --all-targets
      - name: Loop plain + ASan single-threaded mem-ring tests
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          cargo test -p mem-ring --all-features --lib --no-run
          BIN=$(find target/debug/deps -maxdepth 1 -name 'mem_ring-*' -type f -executable | head -1)
          echo "== plain loop (single-threaded)"
          for i in $(seq 1 8); do
            MONOIO_FORCE_LEGACY_DRIVER=1 $BIN --test-threads=1 >/dev/null 2>&1 && echo "plain $i: PASS" || echo "plain $i: CRASH"
          done
          echo "== asan build"
          MONOIO_FORCE_LEGACY_DRIVER=1 RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -p mem-ring --all-features --lib --no-run --target x86_64-unknown-linux-gnu
          ABIN=$(find target/x86_64-unknown-linux-gnu/debug/deps -maxdepth 1 -name 'mem_ring-*' -type f -executable | head -1)
          for i in 1 2 3; do
            MONOIO_FORCE_LEGACY_DRIVER=1 $ABIN --test-threads=1 >/dev/null 2>&1 && echo "asan $i: PASS" || echo "asan $i: CRASH"
          done
      - name: Test
        run: cargo test --all-features --all-targets || true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      GODEBUG: invalidptr=0,cgocheck=0
      # See the build-and-test job for why this is needed.
      MONOIO_FORCE_LEGACY_DRIVER: "1"
      # sccache does not work well with coverage instrumentation;
      # override the workflow-level cache settings for this job.
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info
      - name: Collect Go coverage
        working-directory: test/go
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info,test/go/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- --deny warnings
